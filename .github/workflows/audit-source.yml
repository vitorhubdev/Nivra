name: audit-source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Export only tracked public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nivra-audit"
          git archive --format=tar.gz --output="$RUNNER_TEMP/nivra-audit/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/nivra-audit/SOURCE_COMMIT.txt"
          sha256sum "$RUNNER_TEMP/nivra-audit/source.tar.gz" > "$RUNNER_TEMP/nivra-audit/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nivra-audit-source
          path: ${{ runner.temp }}/nivra-audit/
          if-no-files-found: error
          retention-days: 3
