name: native-client
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mac signing regression (offline)
        if: runner.os != 'Windows'
        run: bash packaging/macos/test_sign_release.sh
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev libasound2-dev libpulse-dev cmake python3 dpkg-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile tests
        run: |
          cargo nextest run --workspace --locked --profile ci --no-run
          # cargo test --doc rejects --no-run. Doctests compile inside the Test step.
      - name: Test
        timeout-minutes: 15
        run: |
          cargo nextest run --workspace --locked --profile ci
          cargo test --workspace --locked --doc
      - name: Check the release feature set and policy
        run: |
          cargo check -p nivra --no-default-features --locked
          cargo xtask policy
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/login-handoff.cjs
      - run: bun tests/xtask-workspace.cjs
      - run: cargo replay
      - run: cargo replay --soak 5
      - name: Linux package regression
        if: runner.os == 'Linux'
        run: PYTHONDONTWRITEBYTECODE=1 python3 packaging/linux/test_package.py
      # The release executable is the long step. PRs compile and test only.
      # Main pushes and v* tags still build and upload dist/.
      - name: Package app without demo or developer features
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: nivra-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: dist/
  extension-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            examples/extensions -> target
      - run: cargo fmt --manifest-path examples/extensions/Cargo.toml --all -- --check
      - name: Test extension workspace
        timeout-minutes: 15
        run: cargo test --manifest-path examples/extensions/Cargo.toml --workspace --locked
      - name: Test host extension contract
        timeout-minutes: 15
        run: cargo test --locked -p extensions --test app_contract --example manifest_check
      - run: cargo clippy --manifest-path examples/extensions/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path examples/extensions/Cargo.toml --workspace --locked --release --target wasm32-unknown-unknown
      - name: Check existing and rebuilt plugins in the host sandbox (offline)
        run: cargo run --locked --release -p extensions --example sdk_check -- examples/extensions/target/wasm32-unknown-unknown/release
      - run: cargo run --locked --release -p extensions --example legacy_sdk_check
  security:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-audit-0.22.2
          cache-targets: false
          cache-on-failure: true
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  licenses:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-deny-0.20.2
          cache-on-failure: true
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo xtask licenses
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun tests/license-policy.cjs
  fuzz:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: rustup toolchain install nightly-2026-09-09 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cargo-fuzz-0.13.2
          cache-on-failure: true
          workspaces: |
            . -> target
            fuzz -> target
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo xtask fuzz
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: target/fuzz-smoke/*.crash
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [native, extension-sdk, security, licenses, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The artifact API needs actions: read; unspecified permissions are none.
      actions: read
    steps:
      # The release notes come from CHANGELOG.md, so the repository has to be here.
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
      # actions/download-artifact@v8 fails the tag run with `digest-mismatch`, so the
      # packaged builds are pulled through the API, which this job already uses.
      - name: Collect the packaged builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > artifacts.json
          while read -r id name; do
            case "$name" in
              nivra-*) ;;
              *) continue ;;
            esac
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${name}.zip"
            unzip -q -o "${name}.zip" -d "release-assets/${name}"
            rm -f "${name}.zip"
            echo "collected ${name}"
          done < <(python3 -c "import json,sys; [print(a['id'], a['name']) for a in json.load(open('artifacts.json'))['artifacts']]")
          rm -f artifacts.json
          ls -1 release-assets
      - name: Publish the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cd release-assets
          for dir in nivra-*; do
            [ -d "$dir" ] || continue
            rest="${dir#nivra-}"
            rest="${rest%-unsigned}"
            os="${rest%-*}"
            arch="${rest##*-}"
            case "$os" in
              Windows)
                exe="$(find "$dir" -type f -name Nivra.exe -print -quit)"
                cp "$exe" "Nivra-${tag}-Windows-${arch}.exe"
                ;;
              macOS)
                app="$(find "$dir" -type d -name Nivra.app -print -quit)"
                (cd "$(dirname "$app")" && zip -r -y "$OLDPWD/Nivra-${tag}-macOS-${arch}.zip" Nivra.app)
                ;;
              Linux)
                tar -czf "Nivra-${tag}-Linux-${arch}.tar.gz" -C "$dir" .
                ;;
            esac
          done
          sha256sum Nivra-"${tag}"-* > SHA256SUMS.txt
          # Notes come from the CHANGELOG section of this version, so a release
          # never repeats an older round's text.
          notes="$(mktemp)"
          awk -v want="## Nivra ${version}" '
            $0 == want { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' "${GITHUB_WORKSPACE}/CHANGELOG.md" > "$notes"
          if [ ! -s "$notes" ]; then
            printf 'Nivra %s\n\nSem notas no CHANGELOG para esta versão.\n' "${version}" > "$notes"
          fi
          printf '\nEstes pacotes não têm assinatura. O Windows pode mostrar "Proteção do Windows" ao abrir o .exe; escolha "Mais informações" e "Executar assim mesmo".\n' >> "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Nivra ${version}" --notes-file "$notes" --verify-tag Nivra-"${tag}"-* SHA256SUMS.txt
