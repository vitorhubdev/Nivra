# cargo-nextest runs each test in its own process, so a crash names that test.
# 30s twice is the 60s hang cap. A slower runner must not grow this.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(page_cache_covers_the_file_and_a_full_database_still_reads)'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'test(a_long_preview_opens_one_window_at_a_time)'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'test(preview_matrix_names_each_format) | test(native_playback_keeps_file_pixels_and_names_the_decoder)'
success-output = "immediate"
