name: finalize-scoped-media-evidence
on:
  push:
    branches: [main]
    paths: ['.github/audit/finalize-*', '.github/workflows/finalize-scoped-media.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the tested source and apply documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          metadata = json.loads(pathlib.Path('.github/audit/finalize-metadata.json').read_text())
          repo, head = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          assert repo == 'vitorhubdev/Nivra'
          def api(method, path, value=None):
              body = None if value is None else json.dumps(value).encode()
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path, data=body, method=method, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          audit = api('GET', 'actions/runs/'+str(metadata['run_id'])+'/jobs')
          native = next(job for job in audit['jobs'] if job['name'] == 'native')
          required = ['Strict workspace lint', 'Workspace behavioral regression tests', 'Compare bounded microphone queue behavior offline', 'Capture revised PROTECT and voice', 'Dependency licenses', 'Prepare a tested candidate without changing main']
          assert all(any(s['name'] == name and s['conclusion'] == 'success' for s in native['steps']) for name in required)
          assert all(s['name'] == 'Strict dependency security gate (no advisory bypass)' for s in native['steps'] if s['conclusion'] == 'failure')
          candidate = api('GET', 'git/commits/'+metadata['candidate_sha'])
          assert [p['sha'] for p in candidate['parents']] == [metadata['base_sha']]
          allowed = {'CHANGELOG.md', 'SECURITY.md', 'docs/performance.md', 'docs/protect.md', 'docs/voice.md', 'docs/storage-policy.md', 'docs/pr-evidence/scoped-media-20261028/README.md', 'docs/pr-evidence/scoped-media-20261028/queue-comparison.json'}
          for name in sorted(allowed):
              if name.startswith('docs/pr-evidence/'):
                  assert not pathlib.Path(name).exists()
                  continue
              baseline_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD:'+name], text=True).strip()
              source = api('GET', 'contents/'+name+'?ref='+metadata['candidate_sha'])
              assert source['sha'] == baseline_sha, name
          encoded = ''.join(pathlib.Path(f'.github/audit/finalize-docs-{i}.b64').read_text().strip() for i in range(1, metadata['parts']+1))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) < 65536 and hashlib.sha256(patch).hexdigest() == metadata['patch_sha256']
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP'], 'docs.patch')
          patch_path.write_bytes(patch)
          stats = subprocess.check_output(['git','apply','--numstat', str(patch_path)],text=True)
          assert {line.split('\t',2)[2] for line in stats.splitlines()} == allowed
          subprocess.run(['git','apply','--check',str(patch_path)],check=True,timeout=30)
          subprocess.run(['git','apply',str(patch_path)],check=True,timeout=30)
          subprocess.run(['git','add','-N',*sorted(allowed)],check=True,timeout=30)
          subprocess.run(['git','diff','--check'],check=True,timeout=30)
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual == allowed
          entries = [{'path':name,'mode':'100644','type':'blob','content':pathlib.Path(name).read_text(encoding='utf-8')} for name in sorted(allowed)]
          tree = api('POST','git/trees',{'base_tree':candidate['tree']['sha'],'tree':entries})
          message = 'fix(protect): deliver scoped recovery and bounded audio latency\n\nIntegrate the exact Windows-tested source tree '+metadata['candidate_sha']+' with reviewed native evidence and documentation.\n\nPartial startup waits for Discord READY; Complete fails closed. Scoped sockets, cancellable stream recovery, applied profile persistence, mute/PTT isolation, bounded PCM catch-up and local playback metrics.\n\nAudit run '+str(metadata['run_id'])+': source checks and offline behavior passed. Strict dependency security remains blocked by crypto-bigint; no advisory added to ignores, no 1.0.21 tag/release, no live-call or hardware speedup claim.\n\nTemporary audit workflows and payloads are absent from this tested tree.'
          commit = api('POST','git/commits',{'message':message, 'tree':tree['sha'], 'parents':[head]})
          result = {'commit_sha':commit['sha'], 'tree_sha':tree['sha'], 'parent_sha':head, 'tested_candidate':metadata['candidate_sha'], 'audit_run':metadata['run_id'], 'ref_updated':False, 'release_published':False}
          pathlib.Path('FINAL_CANDIDATE.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nivra-reviewed-final-candidate
          path: FINAL_CANDIDATE.json
          if-no-files-found: error
          retention-days: 7
